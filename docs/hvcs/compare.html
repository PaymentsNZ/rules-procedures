<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<title>MIXT Diff (Monaco, hard-coded list)</title>
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<link rel="icon" href="data:,"><!-- silence favicon 404 -->
	<style>
		html,
		body {
			height: 100%;
			margin: 0;
		}

		#topbar {
			font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
			display: flex;
			gap: 12px;
			align-items: center;
			padding: 10px 12px;
			border-bottom: 1px solid #ddd;
			white-space: nowrap;
			overflow: auto;
		}

		.row {
			display: flex;
			gap: 8px;
			align-items: center;
			flex-wrap: wrap;
		}

		label {
			font-size: 12px;
			opacity: 0.8;
		}

		select,
		button {
			font: inherit;
			padding: 4px 8px;
			border: 1px solid #ccc;
			border-radius: 6px;
			background: #fff;
		}

		button {
			background: #f5f5f5;
			cursor: pointer;
		}

		button:disabled {
			opacity: .6;
			cursor: default;
		}

		code.badge {
			background: #f0f2f5;
			padding: 2px 6px;
			border-radius: 6px;
			font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
		}

		#container {
			width: 100%;
			height: calc(100% - 68px);
		}

		#status {
			opacity: 0.8;
			font-size: 12px;
		}

		.error {
			color: #b00020;
			white-space: pre-wrap;
		}
	</style>

	<!-- Monaco AMD loader -->
	<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/loader.min.js" crossorigin="anonymous"
		referrerpolicy="no-referrer"></script>
</head>

<body>
	<div id="topbar">
		<div class="row" style="flex:1 1 auto; min-width: 540px;">
			<div id="title"></div>
			<div id="status"></div>
		</div>
		<div class="row" style="flex:0 0 auto;">
			<label for="docSelect">Document:</label>
			<select id="docSelect"></select>
			<button id="reloadBtn" title="Reload current selection">Reload</button>
		</div>
	</div>

	<div id="container"></div>

	<script>
		// Minimal MIXT Monarch tokenizer (keeps us CDN-only, no TextMate/WASM)
		const mixtMonarch = {
			defaultToken: '',
			brackets: [
				{ open: '{', close: '}', token: 'delimiter.curly' },
				{ open: '[', close: ']', token: 'delimiter.bracket' },
				{ open: '(', close: ')', token: 'delimiter.parenthesis' },
			],
			keywords: [
				'let', 'import', 'as', 'meta', 'type', 'list', 'record', 'null', 'true', 'false', 'error',
				'OS.Execute', 'Text.Wrap', 'Text.Flank', 'Record.Combine'
			],
			operators: ['=', '<@', '@>', '::', ':', ';', ',', '.', '->'],
			tokenizer: {
				root: [
					{ include: '@whitespace' },
					[/\/\/.*$/, 'comment'],
					[/\/\*/, { token: 'comment', next: '@comment' }],
					[/;[A-Za-z_][\w.-]*/, 'keyword'],
					[/([A-Za-z_][\w.-]*)(::)/, [{ token: 'type.identifier' }, { token: 'operator' }]],
					[/[A-Za-z_][\w.-]*/, { cases: { '@keywords': 'keyword', '@default': 'identifier' } }],
					[/0[xX][0-9a-fA-F]+/, 'number.hex'],
					[/\d+\.\d+([eE][\-+]?\d+)?/, 'number.float'],
					[/\d+([eE][\-+]?\d+)?/, 'number'],
					[/"([^"\\]|\\.)*"?/, 'string'],
					[/'([^'\\]|\\.)*'?/, 'string'],
					[/`/, { token: 'string.backtick', next: '@bqstring' }],
					[/(<@|@>|::)/, 'operator'],
					[/[\{\}\[\]\(\)]/, '@brackets'],
					[/[=:\.;,]/, 'delimiter']
				],
				comment: [
					[/[^\/*]+/, 'comment'],
					[/\*\//, 'comment', '@pop'],
					[/[\/*]/, 'comment']
				],
				bqstring: [
					[/`/, { token: 'string.backtick', next: '@pop' }],
					[/./, 'string.backtick']
				],
				whitespace: [[/[ \t\r\n]+/, 'white']],
			}
		};
	</script>

	<script type="module">
		const $status = document.getElementById('status');
		const $title = document.getElementById('title');
		const $docSel = document.getElementById('docSelect');
		const $reload = document.getElementById('reloadBtn');

		const setStatus = (m, err = false) => { $status.className = err ? 'error' : ''; $status.textContent = m; };
		const fetchText = async (url) => {
			const res = await fetch(url, { mode: 'cors' });
			if (!res.ok) throw new Error(`${res.status} ${res.statusText} — ${url}`);
			return res.text();
		};

		// --- Hard-coded list of files for the dropdown ---
		const pathList = [
			'src/hvcs/overview.mixt',
			'src/hvcs/common.mixt',
			'src/hvcs/scp.mixt',
			'src/hvcs/mx.mixt',
			'src/hvcs/mt.mixt',
			'src/hvcs/coexistence.mixt',
		];

		// --- Basic params (can still override owner/repo/branches via URL if you want) ---
		const qs = new URLSearchParams(location.search);
		const owner = qs.get('owner') || 'paymentsnz';
		const repo = qs.get('repo') || 'rules-procedures';
		let path = qs.get('path') || pathList[0];   // default to first item
		const base = qs.get('base') || 'ug2025';
		const head = qs.get('head') || 'ug2026';
		const themeName = qs.get('themeName') || 'vs-dark';

		// Ensure the selected path is in the list; if not, insert it at the top
		if (!pathList.includes(path)) pathList.unshift(path);

		// Build raw URLs for current selection
		const rawURL = (branch) =>
			`https://raw.githubusercontent.com/${owner}/${repo}/refs/heads/${branch}/${path}`;

		// Populate dropdown from fixed list
		function populateDropdown() {
			$docSel.innerHTML = '';
			for (const p of pathList) {
				const opt = document.createElement('option');
				opt.value = p;
				opt.textContent = p;
				if (p === path) opt.selected = true;
				$docSel.appendChild(opt);
			}
		}

		// Title
		function setTitle() {
			$title.innerHTML = `
        <strong>Diff:</strong>
        <code class="badge">${owner}/${repo}</code>
        <code class="badge">${path}</code>
        <code class="badge">${base}</code>
        ↔ <code class="badge">${head}</code>
      `;
		}

		// Monaco load (AMD)
		window.require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs' } });
		const monaco = await new Promise((resolve, reject) => {
			window.require(['vs/editor/editor.main'], () => resolve(window.monaco), reject);
		});

		// Register MIXT + Monarch
		const langId = 'mixt';
		if (!monaco.languages.getEncodedLanguageId(langId)) {
			monaco.languages.register({ id: langId, extensions: ['.mixt'], aliases: ['MIXT'] });
			monaco.languages.setMonarchTokensProvider(langId, mixtMonarch);
		}

		// Create editor once
		monaco.editor.setTheme(themeName);
		const diffEditor = monaco.editor.createDiffEditor(document.getElementById('container'), {
			automaticLayout: true,
			readOnly: true,
			renderSideBySide: true,
			renderIndicators: true,
			originalEditable: false
		});

		let originalModel = null;
		let modifiedModel = null;

		async function loadAndRender() {
			setTitle();
			setStatus('Fetching files…');
			$reload.disabled = true;
			try {
				const [lhsText, rhsText] = await Promise.all([
					fetchText(rawURL(base)),
					fetchText(rawURL(head))
				]);

				// Dispose previous models
				if (originalModel) originalModel.dispose();
				if (modifiedModel) modifiedModel.dispose();

				originalModel = monaco.editor.createModel(lhsText, langId);
				modifiedModel = monaco.editor.createModel(rhsText, langId);
				diffEditor.setModel({ original: originalModel, modified: modifiedModel });

				// Jump to first diff
				setTimeout(() => {
					const changes = diffEditor.getLineChanges();
					if (changes && changes.length) {
						const first = changes[0];
						const line = Math.max(1, first.modifiedStartLineNumber);
						const me = diffEditor.getModifiedEditor();
						me.revealLineInCenter(line);
						me.setPosition({ lineNumber: line, column: 1 });
					}
				}, 150);

				// Update URL (no reload) with current path (optional convenience)
				const newQs = new URLSearchParams(location.search);
				newQs.set('path', path);
				history.replaceState(null, '', `${location.pathname}?${newQs.toString()}`);

				setStatus(`Ready — ${owner}/${repo} • ${path} (${base} ↔ ${head})`);
			} catch (err) {
				console.error(err);
				setStatus('Error: ' + (err?.message || String(err)), true);
			} finally {
				$reload.disabled = false;
			}
		}

		// Events
		populateDropdown();
		$docSel.addEventListener('change', () => {
			path = $docSel.value;
			loadAndRender();
		});
		$reload.addEventListener('click', loadAndRender);

		// Initial render
		loadAndRender();
	</script>
</body>

</html>
