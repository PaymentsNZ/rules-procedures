<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 140" width="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#253a72" />
    </marker>
    <style>
      .box { fill: #cfe8f6; stroke: #8fc2e6; stroke-width: 1; rx: 12; ry: 12; }
      .label { font: 600 14px system-ui, sans-serif; fill: #0d223f; }
      .arrow { stroke: #253a72; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>

  <!-- Step 1 -->
  <rect x="20" y="40" width="190" height="60" class="box"/>
  <text x="115" y="75" class="label" text-anchor="middle">Payment instruction</text>

  <!-- Arrow -->
  <line x1="210" y1="70" x2="250" y2="70" class="arrow"/>

  <!-- Step 2 -->
  <rect x="250" y="40" width="190" height="60" class="box"/>
  <text x="345" y="75" class="label" text-anchor="middle">Payment message</text>

  <!-- Arrow -->
  <line x1="440" y1="70" x2="480" y2="70" class="arrow"/>

  <!-- Step 3 -->
  <rect x="480" y="40" width="190" height="60" class="box"/>
  <text x="575" y="75" class="label" text-anchor="middle">Send and settle</text>

  <!-- Arrow -->
  <line x1="670" y1="70" x2="710" y2="70" class="arrow"/>

  <!-- Step 4 -->
  <rect x="710" y="40" width="210" height="60" class="box"/>
  <text x="815" y="65" class="label" text-anchor="middle">Return or amend</text>
  <text x="815" y="85" class="label" text-anchor="middle">payment message</text>

  <!-- Arrow -->
  <line x1="920" y1="70" x2="960" y2="70" class="arrow"/>

  <!-- Step 5 -->
  <rect x="960" y="40" width="210" height="60" class="box"/>
  <text x="1065" y="75" class="label" text-anchor="middle">Credit creditor’s account</text>
</svg>
